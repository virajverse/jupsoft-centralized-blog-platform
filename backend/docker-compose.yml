services:
  postgres:
    image: postgres:16-alpine
    container_name: jupsoft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jupsoft_admin
      POSTGRES_PASSWORD: jupsoft_secret_2026
      POSTGRES_DB: jupsoft_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jupsoft_admin -d jupsoft_cms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jupsoft_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
