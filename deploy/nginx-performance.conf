# ==============================================================================
# Nginx performance/abuse config for Jupsoft Blogary (P1 fixes)
#
# Usage:
#   1. Copy the gzip block into your server {} context.
#   2. Copy the limit_req_zone line into your http {} context (once, globally).
#   3. Copy the /v1/ location block into the server that fronts the NestJS
#      backend (PORT 4010), adjusting proxy_pass if your upstream differs.
#   4. nginx -t && systemctl reload nginx
# ==============================================================================

# ── http {} context (once, globally) ─────────────────────────────────────────
# Rate limit: 30 requests/sec per IP, bursting up to 60. Protects /v1/track,
# search, and public listing endpoints from scrapers and stampedes.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ── server {} context ────────────────────────────────────────────────────────
# gzip: JSON API responses are highly compressible (~80% smaller); without it
# every public blog/list payload ships uncompressed.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  application/json
  application/javascript
  application/xml
  application/rss+xml
  text/css
  text/javascript
  text/plain
  text/xml
  image/svg+xml;

