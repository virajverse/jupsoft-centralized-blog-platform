# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — TRD §18 (AWS-equivalent Production Stack)
#
# TRD §18: "AWS ECS Fargate + RDS PostgreSQL + ElastiCache Redis + S3/CloudFront"
# This compose file mirrors the production architecture for local staging validation.
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

services:
  # ── NestJS CMS Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: jupsoft-cms-backend:latest
    container_name: jupsoft_backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      WEBHOOK_DEFAULT_SECRET: ${WEBHOOK_DEFAULT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - jupsoft_net

  # ── PostgreSQL 16 (mirrors AWS RDS) ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: jupsoft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jupsoft_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jupsoft_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-jupsoft_cms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jupsoft_admin}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jupsoft_net

  # ── Redis 7 (mirrors AWS ElastiCache) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jupsoft_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jupsoft_net

  # ── Admin Portal (Next.js) ───────────────────────────────────────────────────
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    image: jupsoft-admin-portal:latest
    container_name: jupsoft_admin
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - jupsoft_net

volumes:
  postgres_data:
  redis_data:

networks:
  jupsoft_net:
    driver: bridge
